# Hexo 配置
## 文档：https://hexo.io/zh-cn/docs/configuration

# ── 站点 ─────────────────────────────────────────
title: jiournaoshou
subtitle: 写代码，也写点别的
description: 一个人的技术笔记与生活记录。
keywords: 博客, 编程, 笔记
author: jiournaoshou
language: zh-CN
timezone: Asia/Shanghai

# ── URL ──────────────────────────────────────────
## 部署到 GitHub Pages 时改成 https://你的用户名.github.io
url: https://jiournaoshou.github.io/blog/
permalink: :year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# ── 目录 ─────────────────────────────────────────
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - CNAME
  - "*.txt"
  # 附属工具页：原样输出，不走 Markdown/EJS 渲染
  - "tools/word-number-tool/**"
  - "tools/kemu1-tool/**"

# ── 写作 ─────────────────────────────────────────
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true

# ── 代码高亮 ─────────────────────────────────────
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: "  "
  wrap: true
  hljs: false

# ── 首页 ─────────────────────────────────────────
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# ── 分类与标签 ───────────────────────────────────
default_category: 未分类
category_map:
tag_map:

# ── 元信息 ───────────────────────────────────────
meta_generator: false

# ── 日期格式 ─────────────────────────────────────
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: "date"

# ── 分页 ─────────────────────────────────────────
per_page: 10
pagination_dir: page

# ── 扩展 ─────────────────────────────────────────
theme: tty

# ── RSS ──────────────────────────────────────────
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  hub:
  ## 留空则不写 <generator> 标签，避免暴露生成器
  generator:

# ── 部署 ─────────────────────────────────────────
## 默认留空（只生成静态文件）。
## GitHub Pages 方案：见 README.md 的「部署」一节
##    先执行  pnpm add -D hexo-deployer-git
##    再改为  type: git / repo: / branch: gh-pages
deploy:
  type: ""
